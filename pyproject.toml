[build-system]
    build-backend = "setuptools.build_meta"
    requires      = [ "setuptools>=77.0.0", "wheel" ]

[project]
    classifiers = [
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Developers",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python",
        "Topic :: Software Development :: Libraries",
        "Typing :: Typed",
    ]
    dependencies = [
        "bump-my-version>=1.5.1",
        "googleapis-common-protos==1.75.2",
        "grpcio-tools==1.83.1",
        "grpcio==1.83.1",
        "protobuf==7.36.0",
        "protovalidate==1.2.0",
    ]
    description = "Python gRPC interfaces for Agentic Mesh Protocol"
    # PEP 639 license expression (replaces the deprecated "License ::" classifier)
    license = "LicenseRef-Proprietary"
    keywords = [
        "agent",
        "agentic-mesh",
        "digitalkin",
        "grpc",
        "protocol",
        "sdk",
    ]
    name = "agentic-mesh-protocol"
    readme = "README.md"
    requires-python = ">=3.10"
    version = "1.0.3.dev0"

    [project.urls]
        "Bug Tracker"   = "https://github.com/DigitalKin-ai/service-apis-py/issues"
        "Documentation" = "https://github.com/DigitalKin-ai/service-apis-py/blob/main/README.md"
        "Homepage"      = "https://github.com/DigitalKin-ai/service-apis-py"

    [[project.authors]]
        email = "contact@digitalkin.ai"
        name  = "DigitalKin.ai"

[dependency-groups]
    dev = [
        "build>=1.6.0",
        "bump-my-version>=1.5.1",
        "mypy>=2.3.1",
        "pre-commit>=4.6.2",
        "pytest>=9.1.1",
        "ruff>=0.16.5",
        "twine>=6.2.0",
    ]

# The whole package is generated into gen/ by `task gen` (nothing importable is checked in)
[tool.setuptools]
    package-dir = { "" = "gen" }

    [tool.setuptools.packages.find]
        where = [ "gen" ]

    [tool.setuptools.package-data]
        agentic_mesh_protocol = [ "**/*.pyi", "py.typed" ]
        buf                   = [ "**/*.pyi" ]

[tool.ruff]
    src            = [ "gen", "test" ]
    target-version = "py310"

[tool.pytest.ini_options]
    python_files = "test_*.py"
    testpaths    = [ "test" ]
